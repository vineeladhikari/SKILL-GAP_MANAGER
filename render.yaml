services:
  - type: web
    name: vk-skilltech-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main
    buildFilter:
      paths:
        - BACKEND/**
        - render.yaml
    dockerfilePath: ./BACKEND/Dockerfile
    dockerContext: ./BACKEND
    healthCheckPath: /api/roles
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: skill-gap-manager-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: skill-gap-manager-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: skill-gap-manager-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: skill-gap-manager-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: skill-gap-manager-db
          property: password
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAME_SITE
        value: "none"
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://vk-skilltech.onrender.com,http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: vk-skilltech
    runtime: static
    branch: main
    rootDir: FRONTEND
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - FRONTEND/**
        - render.yaml
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://vk-skilltech-backend.onrender.com

databases:
  - name: skill-gap-manager-db
    databaseName: skillgap
    user: skillgap
    plan: basic-256mb
    region: oregon
    ipAllowList: []
